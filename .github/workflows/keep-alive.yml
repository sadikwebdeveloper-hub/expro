name: Keep Render Alive

on:
  schedule:
    # প্রতি ১০ মিনিট পর পর রান হবে
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Website
        run: |
          curl -s https://exprogroupbd.com > /dev/null
          echo "Ping sent to exprogroupbd.com at $(date)"